name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -B -m unittest discover -p "test_*.py" -q
      - name: Release integrity check
        run: python -B verify_release.py
      - name: Red-green demonstration
        run: python -B red_green_demo.py
      - name: Sample validation
        run: python -B jsonl_utf8_guard.py --input sample_events.jsonl

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dev-only quality tools (not required to run the project)
        run: python -m pip install ruff==0.16.9 mypy==2.3.1 coverage==7.17.1
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --strict jsonl_utf8_guard.py verify_release.py red_green_demo.py
      - name: Coverage threshold
        run: |
          python -B -m coverage run -m unittest discover -p "test_*.py" -q
          python -m coverage report

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel (build-time tool only; the package has no runtime dependencies)
        run: python -m pip install build==1.6.1 && python -m build
      - name: Install the wheel in a clean venv and run the console script
        run: |
          python -m venv /tmp/pkgtest
          /tmp/pkgtest/bin/pip install dist/*.whl
          /tmp/pkgtest/bin/jsonl-utf8-guard --input sample_events.jsonl
          # Only the package itself may be installed besides the venv's own tooling.
          test "$(/tmp/pkgtest/bin/pip list --format=freeze | grep -Evc '^(pip|setuptools)==')" = "1"
