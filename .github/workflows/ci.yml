name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -B -m unittest discover -p "test_*.py" -q
      - name: Release integrity check
        run: python -B verify_release.py
      - name: Red-green demonstration
        run: python -B red_green_demo.py
      - name: Sample validation
        run: python -B jsonl_utf8_guard.py --input sample_events.jsonl
