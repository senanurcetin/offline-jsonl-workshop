name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -B -m unittest discover -p "test_*.py" -q
      - name: Release integrity check
        run: python -B verify_release.py
      - name: Red-green demonstration
        run: python -B red_green_demo.py
      - name: Sample validation
        run: python -B jsonl_utf8_guard.py --input sample_events.jsonl

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dev-only quality tools (not required to run the project)
        run: python -m pip install ruff==0.16.9 mypy==2.3.1 coverage==7.17.1
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --strict jsonl_utf8_guard.py verify_release.py red_green_demo.py
      - name: Coverage threshold
        run: |
          python -B -m coverage run -m unittest discover -p "test_*.py" -q
          python -m coverage report
